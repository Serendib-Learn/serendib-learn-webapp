name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  server:
    name: API (typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - working-directory: server
        run: npm ci
      - working-directory: server
        run: npm run typecheck

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [frontend, server]
    steps:
      - uses: actions/checkout@v4

      # Build-only, no push and no real secrets — this exists to catch a
      # broken Dockerfile before it reaches the deploy workflow, not to
      # produce anything used later in the pipeline.
      - name: Build API image
        run: docker build -f server/Dockerfile -t serendib-api:ci .

      - name: Build web image
        run: docker build -t serendib-web:ci .
