name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  server:
    name: API (typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      # The integration tests spin up a real (in-memory) MongoDB via
      # mongodb-memory-server, which downloads a mongod binary on first use.
      # Caching it means only the first-ever CI run pays that cost.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - working-directory: server
        run: npm ci
      - working-directory: server
        run: npm run typecheck
      - working-directory: server
        run: npm test

  docker:
    name: Docker images build + vulnerability scan
    runs-on: ubuntu-latest
    needs: [frontend, server]
    # security-events: write is needed to upload the SARIF scan results to
    # the repo's Security tab (Code scanning alerts).
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      # Build-only, no push and no real secrets — this exists to catch a
      # broken Dockerfile before it reaches the deploy workflow, not to
      # produce anything used later in the pipeline.
      - name: Build API image
        run: docker build -f server/Dockerfile -t serendib-api:ci .

      - name: Build web image
        run: docker build -t serendib-web:ci .

      # Two passes per image: the first never fails the job and just
      # uploads results to the Security tab so alerts are browsable over
      # time; the second is the actual gate — it fails the job outright on
      # a CRITICAL/HIGH finding with a fix available. ignore-unfixed skips
      # vulnerabilities with no patch yet, since failing CI for something
      # there's no action to take on is just noise.
      - name: Scan API image (report)
        if: always()
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: serendib-api:ci
          format: sarif
          output: trivy-api.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload API image scan to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-api.sarif
          category: trivy-api-image

      - name: Scan API image (gate)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: serendib-api:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan web image (report)
        if: always()
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: serendib-web:ci
          format: sarif
          output: trivy-web.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload web image scan to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-web.sarif
          category: trivy-web-image

      - name: Scan web image (gate)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: serendib-web:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  secret-scan:
    name: Secret scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      # Scans the working tree as checked out (not full git history — the
      # repo's history was already checked by hand for committed secrets
      # when it went public; this guards against new ones from here on).
      - name: Scan for committed secrets (report)
        if: always()
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: sarif
          output: trivy-secrets.sarif
          exit-code: "0"

      - name: Upload secret scan to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-secrets.sarif
          category: trivy-secrets

      - name: Scan for committed secrets (gate)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          exit-code: "1"
